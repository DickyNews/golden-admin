<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dicky News Golden Admin</title><style>:root{--bg:#0b0b0b;--card:#141414;--line:#2b2b2b;--text:#f5f5f5;--muted:#9d9d9d;--yellow:#ffd21a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,Arial,sans-serif}main{width:min(760px,calc(100% - 28px));margin:40px auto}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}h1{margin:0;font-size:27px}.sub{color:var(--muted);font-size:13px;margin-top:5px}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px;margin-bottom:16px}label{display:block;color:var(--muted);font-size:13px;margin-bottom:7px}input,select{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:#0f0f0f;color:var(--text);outline:none}.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}button{border:0;border-radius:12px;padding:12px 16px;font-weight:800;cursor:pointer}.primary{background:var(--yellow);color:#111}.secondary{background:#252525;color:#fff;border:1px solid var(--line)}.actions{display:flex;gap:10px;margin-top:18px}.hidden{display:none}.status{margin-top:14px;color:var(--muted);font-size:13px}.ok{color:#8ee28e}.err{color:#ff7777}.service{display:flex;justify-content:space-between;gap:15px;align-items:center}.badge{padding:7px 10px;border-radius:999px;background:#242000;color:var(--yellow);font-size:12px;font-weight:800}@media(max-width:600px){.row{grid-template-columns:1fr}.top{align-items:flex-start}}</style></head><body><main><div class="top"><div><h1>Dicky News Golden Admin</h1><div class="sub">Kontrol layanan, customer, COIN, dan key</div></div><button class="secondary hidden" id="logout">Keluar</button></div><section class="card" id="loginCard"><h2>Login Admin</h2><div style="margin-top:16px"><label>Username</label><input id="username" value="Dicky News" autocomplete="username"></div><div style="margin-top:14px"><label>Password</label><input id="password" type="password" autocomplete="current-password"></div><div class="actions"><button class="primary" id="login">Masuk</button></div><div class="status" id="loginStatus"></div></section><section class="card hidden" id="panel"><div class="service"><div><h2 style="margin:0">Golden HD TikTok</h2><div class="sub">Pengaturan layanan utama</div></div><span class="badge" id="serviceStatus">MEMUAT</span></div><div class="row" style="margin-top:22px"><div><label>Harga per video (Coin)</label><input id="coin" type="number" min="0" step="1"></div><div><label>Maksimum ukuran video (MB)</label><input id="maxMb" type="number" min="1" step="1"></div></div><div style="margin-top:14px"><label>Status layanan</label><select id="active"><option value="true">AKTIF</option><option value="false">NONAKTIF</option></select></div><div class="actions"><button class="primary" id="save">Simpan Pengaturan</button><button class="secondary" id="refresh">Refresh</button></div><div class="status" id="status"></div></section><section class="card hidden" id="customerPanel"><div class="service"><div><h2 style="margin:0">Customer & Coin</h2><div class="sub">Buat customer, generate key, dan atur saldo COIN.</div></div></div><div class="row" style="margin-top:18px"><div><label>Nama customer</label><input id="customerName" placeholder="Nama customer"></div><div><label>WhatsApp (opsional)</label><input id="customerWhatsapp" placeholder="08xxxxxxxxxx"></div></div><div class="actions"><button class="primary" id="createCustomer">Buat Customer</button><button class="secondary" id="refreshCustomers">Refresh</button></div><div class="status" id="customerStatus"></div><div id="customers" style="margin-top:16px"></div></section></main><script>const API_BASE='https://103-235-74-92.sslip.io';const $=id=>document.getElementById(id);async function api(path,opt={}){const r=await fetch(API_BASE+path,{credentials:'include',...opt,headers:{'Content-Type':'application/json',...(opt.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.detail||d.message||'Request gagal');return d}async function load(){const d=await api('/admin/pricing');const s=d.services[0];if(!s)throw new Error('Service tidak ditemukan');$('coin').value=s.coin_cost;$('maxMb').value=Math.round(s.max_file_size_bytes/1048576);$('active').value=String(!!s.is_active);$('serviceStatus').textContent=s.is_active?'AKTIF':'NONAKTIF';$('status').textContent='Pengaturan terbaru berhasil dimuat.';$('status').className='status ok'}window.loadCustomers=async function(){try{const d=await api('/admin/customers');const list=Array.isArray(d)?d:(d.customers||[]);$('customers').innerHTML=list.length?list.map(c=>{const id=c.id??c.customer_id;const bal=c.coin_balance??c.coins??c.balance??'?';return '<div style="border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:10px"><b>'+String(c.name??'Customer')+'</b><div class="status">ID '+id+' · COIN '+bal+'</div><div class="row" style="margin-top:10px"><input id="adj-'+id+'" type="number" step="1" value="0" placeholder="+/- COIN"><input id="desc-'+id+'" placeholder="Keterangan"></div><div class="actions"><button class="primary" onclick="adjustCoins('+id+')">Simpan COIN</button><button class="secondary" onclick="generateKey('+id+')">Generate Key</button></div><div id="key-'+id+'" class="status"></div></div>'}).join(''):'<div class="status">Belum ada customer.</div>'}catch(e){$('customerStatus').textContent=e.message;$('customerStatus').className='status err'}};window.generateKey=async function(id){try{const d=await api('/admin/customers/'+id+'/keys',{method:'POST',body:JSON.stringify({})});const k=d.key||d.customer_key||d.token||JSON.stringify(d);$('key-'+id).textContent='KEY: '+k;$('key-'+id).className='status ok'}catch(e){$('key-'+id).textContent=e.message;$('key-'+id).className='status err'}};window.adjustCoins=async function(id){try{const amount=Number($('adj-'+id).value);if(!Number.isInteger(amount))throw new Error('COIN harus bilangan bulat');await api('/admin/customers/'+id+'/coins',{method:'POST',body:JSON.stringify({amount,description:$('desc-'+id).value.trim()||null})});$('customerStatus').textContent='Saldo COIN berhasil diubah.';$('customerStatus').className='status ok';await loadCustomers()}catch(e){$('customerStatus').textContent=e.message;$('customerStatus').className='status err'}};$('login').onclick=async()=>{try{await api('/admin/login',{method:'POST',body:JSON.stringify({username:$('username').value,password:$('password').value})});$('loginCard').classList.add('hidden');$('panel').classList.remove('hidden');$('customerPanel').classList.remove('hidden');$('logout').classList.remove('hidden');await load();await loadCustomers()}catch(e){$('loginStatus').textContent=e.message;$('loginStatus').className='status err'}};$('save').onclick=async()=>{try{const d=await api('/admin/pricing');const s=d.services[0];await api('/admin/pricing/'+s.id,{method:'PUT',body:JSON.stringify({coin_cost:Number($('coin').value),max_file_size_bytes:Number($('maxMb').value)*1048576,is_active:$('active').value==='true'})});await load();$('status').textContent='Berhasil disimpan.';$('status').className='status ok'}catch(e){$('status').textContent=e.message;$('status').className='status err'}};$('refresh').onclick=()=>load().catch(e=>{$('status').textContent=e.message;$('status').className='status err'});$('logout').onclick=async()=>{try{await api('/admin/logout',{method:'POST'})}catch{}location.reload()};$('createCustomer').onclick=async()=>{try{const name=$('customerName').value.trim();if(!name)throw new Error('Nama customer wajib diisi');await api('/admin/customers',{method:'POST',body:JSON.stringify({name,whatsapp:$('customerWhatsapp').value.trim()||null})});$('customerName').value='';$('customerWhatsapp').value='';$('customerStatus').textContent='Customer berhasil dibuat.';$('customerStatus').className='status ok';await loadCustomers()}catch(e){$('customerStatus').textContent=e.message;$('customerStatus').className='status err'}};$('refreshCustomers').onclick=loadCustomers;</script></body></html>
